name: Download MediaFire File

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Puppeteer
      run: npm install puppeteer
    
    - name: Download
      shell: bash
      run: |
        node -e '
        const puppeteer = require("puppeteer");
        const fs = require("fs");
        const https = require("https");
        const http = require("http");
        
        (async () => {
          const browser = await puppeteer.launch({ headless: true, args: ["--no-sandbox", "--disable-setuid-sandbox"] });
          const page = await browser.newPage();
          
          await page.goto("https://www.mediafire.com/file/9p6plb3dibyr6ed/R5-itel-Power-55-P661N-17.rar/file", { waitUntil: "networkidle2" });
          
          await page.waitForSelector("#downloadButton", { timeout: 30000 });
          
          const downloadUrl = await page.evaluate(() => {
            const btn = document.querySelector("#downloadButton");
            return btn ? btn.href : null;
          });
          
          if (!downloadUrl) {
            console.error("Download button not found");
            await browser.close();
            process.exit(1);
          }
          
          console.log("Download URL found, starting download...");
          
          const protocol = downloadUrl.startsWith("https") ? https : http;
          const file = fs.createWriteStream("R5-itel-Power-55-P661N-17.rar");
          
          protocol.get(downloadUrl, {
            headers: { "User-Agent": "Mozilla/5.0", "Referer": "https://www.mediafire.com/" }
          }, (response) => {
            const total = parseInt(response.headers["content-length"], 10);
            let downloaded = 0;
            
            response.on("data", (chunk) => {
              downloaded += chunk.length;
              if (total) {
                const percent = ((downloaded / total) * 100).toFixed(1);
                const mbDown = (downloaded / 1024 / 1024).toFixed(2);
                const mbTotal = (total / 1024 / 1024).toFixed(2);
                process.stdout.write(`\rDownloading: ${percent}% (${mbDown} MB / ${mbTotal} MB)`);
              }
            });
            
            response.pipe(file);
            file.on("finish", () => {
              console.log("\n✅ Download complete");
              browser.close();
            });
          }).on("error", (err) => {
            console.error("\n❌ Download failed:", err.message);
            browser.close();
            process.exit(1);
          });
        })();
        '
    
    - name: Verify
      run: ls -lh R5-itel-Power-55-P661N-17.rar
